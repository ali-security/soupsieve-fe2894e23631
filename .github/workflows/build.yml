name: build

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional pytest selector; when set only the selected tests run'
        required: false
        default: ''

jobs:
  tests:
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        # ubuntu-22.04: setup-python cannot provision Python 3.7 on ubuntu-24.04
        # 3.9/3.10/3.11 pinned to patch releases whose html.parser predates the 2025 iframe raw-text change
        platform: [ubuntu-22.04, windows-latest]
        tox-env: [py37, py38, py39, py310, py311, nolxml, nohtml5lib]
        include:
          - tox-env: py37
            python-version: 3.7
            continue-on-error: false
          - tox-env: py38
            python-version: 3.8
            continue-on-error: false
          - tox-env: py39
            python-version: '3.9.13'
            continue-on-error: false
          - tox-env: py310
            python-version: '3.10.11'
            continue-on-error: false
          - tox-env: py311
            python-version: '3.11.9'
            continue-on-error: false
          - tox-env: nolxml
            python-version: '3.11.9'
            continue-on-error: false
          - tox-env: nohtml5lib
            python-version: '3.10.11'
            continue-on-error: false
        # exclude:
        #   - platform: windows-latest
        #     tox-env: py311

    env:
      TOXENV: ${{ matrix.tox-env }}

    runs-on: ${{ matrix.platform }}

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python ${{ matrix.python-version }}
      if: "!endsWith(matrix.python-version, '-dev')"
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Set up development Python ${{ matrix.python-version }}
      if: endsWith(matrix.python-version, '-dev')
      uses: deadsnakes/action@v2.1.1
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools build tox coverage
    - name: Test
      run: |
        # Pin test deps to release-era versions: bs4 4.13 changed iframe handling/typing, lxml>=5 emits an
        # extra strip_cdata DeprecationWarning (breaks test_contains_warn), newer mypy flags 2023-era code
        printf 'beautifulsoup4==4.12.2\nlxml==4.9.2\nmypy==1.2.0\n' > "$RUNNER_TEMP/constraints.txt"
        export PIP_CONSTRAINT="$RUNNER_TEMP/constraints.txt"
        if [ -n "${{ inputs.test-filter }}" ]; then
          python -m pip install -r requirements/tests.txt .
          python -m pytest ${{ inputs.test-filter }}
        else
          python -m tox
        fi
      shell: bash

  package:
    timeout-minutes: 20
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: 3.9
      - name: Package
        run: |
          pip install --index-url 'https://:2023-04-16T23:56:46.279633Z@time-machines-pypi.sealsecurity.io/' --upgrade build hatchling==1.14.0
          python -m build -s -w --no-isolation
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
